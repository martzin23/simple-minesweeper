<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Minesweeper</title>
    <link rel="stylesheet" href="styles/layout.css"/>
    <link rel="stylesheet" href="styles/cell.css"/>
    <link rel="stylesheet" href="styles/generic.css"/>
    <link rel="stylesheet" href="styles/variables.css"/>
    <link rel="stylesheet" href="styles/font.css"/>
    <link rel="stylesheet" href="styles/flex.css"/>
    <script defer src="scripts/main.js"></script>
	<!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" /> -->
</head>
<body>
    <main>
        <header>
            <p id="title">Minesweeper</p>
            <samp id="indicator" class="hidden">
                <div>
                    <div>
                        <img src="images/mine.png" alt="">
                        <p id="mines">0</p>
                    </div>
                </div>
            </samp>
            <button id="reset" class="hidden">
                <div>
                    <img src="images/reset.png" alt="">
                </div>
            </button>
            <button id="maximize">
                <div>
                    <img src="images/maximize.png" alt="">
                </div>
            </button>
            <button id="minimize" class="hidden">
                <div>
                    <img src="images/minimize.png" alt="">
                </div>
            </button>
        </header>
        <div id="grid" class="hidden">
        </div>
        <menu id="menu">
            <li>
                <p>Grid</p>
                <div class="row gap-medium" id="switch_size">
                    <button value="[8,10]" class="selected">
                        <div>
                            <p>Small</p>
                        </div>
                    </button>
                    <button value="[10, 16]">
                        <div>
                            <p>Large</p>
                        </div>
                    </button>
                    <button value="full">
                        <div>
                            <p>Full</p>
                        </div>
                    </button>
                </div>
            </li>
            <hr>
            <li>
                <p>Mines</p>
                <div class="row gap-medium" id="switch_mines">
                    <button value="0.1">
                        <div>
                            <p>Few</p>
                        </div>
                    </button>
                    <button value="0.175" class="selected">
                        <div>
                            <p>Moderate</p>
                        </div>
                    </button>
                    <button value="0.25">
                        <div>
                            <p>Many</p>
                        </div>
                    </button>
                </div>
            </li>
            <hr>
            <li>
                <button id="start" class="clickable">
                    <div>
                        <p>Start</p>
                    </div>
                </button>
            </li>
        </menu>
    </main>
</body>
</html>
