<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Minesweeper</title>
    <link rel="stylesheet" href="styles/layout.css"/>
    <link rel="stylesheet" href="styles/cell.css"/>
    <link rel="stylesheet" href="styles/generic.css"/>
    <link rel="stylesheet" href="styles/variables.css"/>
    <link rel="stylesheet" href="styles/font.css"/>
    <script defer src="scripts/main.js"></script>
</head>
<body>
    <main>
        <header>
            <p id="title">Simple Minesweeper</p>
            <samp id="indicator" class="hidden">
                <div>
                    <img src="images/mine.png" alt="">
                    <p id="counter_mines">0</p>
                </div>
            </samp>
            <button id="button_reset" class="hidden">
                <div>
                    <img src="images/reset.png" alt="">
                </div>
            </button>
            <button id="button_maximize">
                <div>
                    <img src="images/maximize.png" alt="">
                </div>
            </button>
            <button id="button_minimize" class="hidden">
                <div>
                    <img src="images/minimize.png" alt="">
                </div>
            </button>
        </header>
        <div id="grid" class="hidden">
        </div>
        <menu id="menu">
            <li>
                <p>Grid</p>
                <div id="switch_size">
                    <button value="[10,10]" class="selected">
                        <div>
                            <p>Small</p>
                        </div>
                    </button>
                    <button value="[15, 15]">
                        <div>
                            <p>Large</p>
                        </div>
                    </button>
                    <button value="full">
                        <div>
                            <p>Full</p>
                        </div>
                    </button>
                </div>
            </li>
            <hr>
            <li>
                <p>Mines</p>
                <div id="switch_mines">
                    <button value="0.1">
                        <div>
                            <p>Few</p>
                        </div>
                    </button>
                    <button value="0.175" class="selected">
                        <div>
                            <p>Moderate</p>
                        </div>
                    </button>
                    <button value="0.25">
                        <div>
                            <p>Many</p>
                        </div>
                    </button>
                </div>
            </li>
            <hr>
            <li>
                <button id="button_start" class="clickable">
                    <div>
                        <p>Start</p>
                    </div>
                </button>
            </li>
        </menu>
    </main>
</body>
</html>
